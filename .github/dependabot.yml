version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directories: [/, /portal/server, /portal/web]
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /.github/lint
    schedule:
      interval: monthly
    groups:
      lint-tools:
        patterns: ['*']

  - package-ecosystem: docker
    directories: [/, /portal]
    schedule:
      interval: weekly
    groups:
      node-base:
        patterns: ['*']
    # Production stays on a Node LTS line; moving to the next LTS is a deliberate,
    # verified upgrade. Odd-numbered majors (like 25) are never LTS.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']

  # Audio services: Deploy stops on these and they need an operator release
  # (docs/portal-operations.md), so they are proposed monthly, not weekly.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
