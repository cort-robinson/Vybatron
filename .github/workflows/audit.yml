name: Dependency audit

# New advisories surface nightly instead of failing unrelated pull requests;
# a pull request that changes dependencies is still audited before merge.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '**/package.json'
      - '**/package-lock.json'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Audit runtime dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm --prefix portal/server audit --omit=dev --audit-level=high
          npm --prefix portal/web audit --omit=dev --audit-level=high
