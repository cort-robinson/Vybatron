name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build bot image
        run: docker build -t vybertron-bot:ci .

      - name: Validate compose file
        run: docker compose config --quiet
        env:
          DISCORD_BOT_TOKEN: ci-placeholder
          CLIENT_ID: ci-placeholder
          LAVALINK_PASSWORD: ci-placeholder
          SPOTIFY_SP_DC: ""
