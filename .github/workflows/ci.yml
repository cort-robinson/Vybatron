name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/lint/requirements.txt

      - name: Install lint tools
        run: pip install -r .github/lint/requirements.txt

      - name: Lint workflows
        run: actionlint

      - name: Lint shell scripts
        run: shellcheck warp/*.sh tests/*.sh

      - name: Lint Python
        run: ruff check ops tests

      - name: Parse Lavalink configuration
        run: python -c "import sys, yaml; list(yaml.safe_load_all(open(sys.argv[1])))" lavalink/application.yml

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOT_IMAGE: vybertron-bot:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # Test the recovery and release drivers on Python 3.12, the oldest a host runs.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Test recovery and release drivers
        run: python -m unittest discover -s tests -p '*_test.py'

      - name: Build bot image
        run: docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$BOT_IMAGE" .

      - name: Verify container persistence permissions
        run: >-
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m
          -v vybertron-ci-data:/app/data -e VYBERTRON_DATA_DIR=/app/data
          "$BOT_IMAGE" node --input-type=module -e
          "import {writeFile,readFile} from 'node:fs/promises';
          if(process.getuid()===0)throw new Error('root runtime');
          await writeFile('/app/data/ci-check','ok');
          if(await readFile('/app/data/ci-check','utf8')!=='ok')throw new Error('unwritable data volume');"

      - name: Verify WARP daemon recovery
        run: bash tests/warp-supervisor.test.sh

      - name: Validate compose file
        run: docker compose config --quiet
        env:
          DISCORD_BOT_TOKEN: ci-placeholder
          CLIENT_ID: ci-placeholder
          LAVALINK_PASSWORD: ci-placeholder
          SPOTIFY_SP_DC: ""

      # Deploy ships this exact tested image rather than rebuilding it.
      - name: Save bot image for release
        if: github.event_name == 'push'
        run: docker save "$BOT_IMAGE" | gzip -1 > vybertron-bot.tar.gz

      - name: Upload bot image for release
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: vybertron-bot.tar.gz
          archive: false
          retention-days: 1

  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORTAL_IMAGE: vybertron-portal:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            portal/server/package-lock.json
            portal/web/package-lock.json
      - name: Install portal dependencies
        run: |
          npm ci
          npm --prefix portal/server ci
          npm --prefix portal/web ci
      - name: Test portal authentication and API
        run: npm run portal:test
      - name: Build portal web client
        run: npm run portal:build
      - name: Find the Playwright version
        id: playwright
        working-directory: portal/web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install browser for portal verification
        working-directory: portal/web
        run: npx playwright install chromium
      - name: Verify browser OAuth through proxy and authoritative bot adapter
        run: npm run portal:integration
      - name: Build isolated portal image
        run: docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -f portal/Dockerfile -t "$PORTAL_IMAGE" .
      - name: Verify encrypted login persistence across bounded containers
        run: |
          for phase in create reopen; do
            docker run --rm -i --read-only --memory=192m --memory-swap=256m --cpus=0.5 --pids-limit=64 \
              --tmpfs /tmp:rw,noexec,nosuid,size=16m -v vybertron-ci-portal-auth:/app/data \
              -e NODE_OPTIONS=--max-old-space-size=112 -e PORTAL_CI_PHASE=$phase \
              "$PORTAL_IMAGE" node --input-type=module < portal/integration/container-auth.mjs
          done
      - name: Validate private portal overlay
        run: docker compose -f docker-compose.yml -f docker-compose.portal.yml --profile portal config --quiet
        env:
          DISCORD_BOT_TOKEN: ci-placeholder
          CLIENT_ID: ci-placeholder
          LAVALINK_PASSWORD: ci-placeholder
          PORTAL_ORIGIN: https://vybatron.example.ts.net
          DISCORD_CLIENT_SECRET: ci-placeholder
          PORTAL_BRIDGE_TOKEN: ci-placeholder
          PORTAL_SESSION_SECRET: ci-placeholder
      - name: Validate portal Funnel sidecar
        run: |
          docker compose -f ops/portal-funnel/compose.yml config --quiet
          jq -e '.AllowFunnel | length == 1' ops/portal-funnel/serve.json
      - name: Save portal image for release
        if: github.event_name == 'push'
        run: docker save "$PORTAL_IMAGE" | gzip -1 > vybertron-portal.tar.gz
      - name: Upload portal image for release
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: vybertron-portal.tar.gz
          archive: false
          retention-days: 1

  # Plans the slow jobs. The browser shards and the Android build run only when a
  # file they read changed (scripts/ci-plan.mjs). A pull request compares its head
  # with its base. A main push compares with the previous main commit, and only
  # when that commit's CI passed, so each skip leans on a green run of the same
  # files. Separately, a main push whose tree matches a same-repository pull
  # request run that already passed the browser suite skips the suite: tree
  # equality means identical files. Anything the plan can't list runs everything.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      tree: ${{ steps.plan.outputs.tree }}
      browser: ${{ steps.plan.outputs.browser }}
      android: ${{ steps.plan.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Plan the browser and Android jobs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_ID: ${{ github.repository_id }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          TREE=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$TREE" >> "$GITHUB_OUTPUT"
          # Changed paths (both sides of a rename), or nothing when the list is
          # unavailable or may be truncated (the compare API stops at 300 files).
          changed() {
            gh api "repos/$GITHUB_REPOSITORY/compare/$1...$2" \
              --jq 'if (.files | length) >= 300 then empty else .files[] | .filename, (.previous_filename // empty) end'
          }
          FILES=""
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            FILES=$(changed "$BASE_SHA" "$HEAD_SHA") || FILES=""
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            GREEN=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$BEFORE&event=push&status=success" \
              --jq '.total_count') || GREEN=0
            if [ "$GREEN" -gt 0 ]; then FILES=$(changed "$BEFORE" "$GITHUB_SHA") || FILES=""; fi
          fi
          PLAN=$(printf '%s\n' "$FILES" | node scripts/ci-plan.mjs)
          BROWSER=$(sed -n 's/^browser=//p' <<< "$PLAN")
          ANDROID=$(sed -n 's/^android=//p' <<< "$PLAN")
          if [ "$BROWSER" = false ]; then
            echo "::notice::No file the browser suite reads changed; skipping it."
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            PASSED=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=browser-verified-$TREE&per_page=100" \
              --jq "[.artifacts[] | select((.expired | not) and .workflow_run.head_repository_id == $REPO_ID)] | length")
            if [ "$PASSED" -gt 0 ]; then
              BROWSER=false
              echo "::notice::A pull request run already passed the browser suite on tree $TREE; skipping it here."
            fi
          fi
          if [ "$ANDROID" = false ]; then echo "::notice::No Android file changed; skipping the Android build."; fi
          { echo "browser=$BROWSER"; echo "android=$ANDROID"; } | tee -a "$GITHUB_OUTPUT"

  browser:
    name: browser (${{ matrix.shard }}/6)
    needs: plan
    if: needs.plan.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Each shard is CPU-bound at 2 workers (the WebGL specs render in software),
        # so more machines, not more workers, is what shortens the suite.
        shard: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        working-directory: portal/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portal/web/package-lock.json
      - name: Install portal web dependencies
        run: npm ci
      - name: Find the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # The runner image already has Chromium's system libraries, so skip apt
      # (--with-deps), which once took ten minutes. On a cache hit this is a no-op.
      - name: Install browser
        run: npx playwright install chromium
      - name: Verify portal desktop, phone and accessibility
        run: npx playwright test --shard=${{ matrix.shard }}/6
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-shard-${{ matrix.shard }}
          path: |
            portal/web/playwright-report
            portal/web/test-results
          retention-days: 7

  browser-verified:
    needs: [plan, browser]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record the tested tree
        run: echo "$TREE" > browser-verified.txt
        env:
          TREE: ${{ needs.plan.outputs.tree }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-verified-${{ needs.plan.outputs.tree }}
          path: browser-verified.txt
          retention-days: 14

  # The Android app: JVM tests, lint and a debug build. The bridge-scope test needs
  # a device and the live portal, so it runs by hand (portal/android/README.md).
  android:
    needs: plan
    if: needs.plan.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: portal/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      # Validates the committed Gradle wrapper and caches Gradle's downloads.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Test, lint and build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

  # The single required status check. Fails when any verification job fails, is
  # cancelled or is skipped, except the browser shards and the Android build when
  # the plan found nothing for them to verify (see plan).
  check:
    name: Check
    if: always()
    needs: [lint, test, portal, android, plan, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '
            .plan.outputs as $plan
            | all(to_entries[]; .value.result == "success"
                or (.value.result == "skipped" and .key == "browser" and $plan.browser == "false")
                or (.value.result == "skipped" and .key == "android" and $plan.android == "false"))' > /dev/null
