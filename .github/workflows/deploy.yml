name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    # Dormant until the repo variable DEPLOY_ENABLED is set to "true"
    # (Settings -> Secrets and variables -> Actions -> Variables).
    # Also requires secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -euo pipefail
            cd ~/Vybertron
            exec 9>/run/lock/vybertron-maintenance.lock
            flock -w 600 9
            # Refuse to discard an interrupted update's live configuration.
            if [ -f ops/recovery.py ]; then python3 ops/recovery.py restore-pin; fi
            OLD_HEAD=$(git rev-parse HEAD)
            OLD_AUDIO_CONFIG=$(sha256sum lavalink/application.yml | cut -d ' ' -f1)
            git fetch origin main
            git reset --hard origin/main
            # Preserve an automatically tested pin across unrelated deployments.
            python3 ops/recovery.py restore-pin
            docker compose pull
            docker compose up -d --build
            # Bind-mounted files don't change the Compose hash.
            if ! git diff --quiet "$OLD_HEAD" HEAD -- warp/ docker-compose.yml; then
              # These services share WARP's network namespace. Recreate them
              # together, then reconnect the bot after Lavalink is healthy.
              docker compose up -d --force-recreate warp yt-cipher lavalink
              docker compose up -d --wait lavalink
              docker compose restart bot
            elif [ "$OLD_AUDIO_CONFIG" != "$(sha256sum lavalink/application.yml | cut -d ' ' -f1)" ]; then
              docker compose up -d --force-recreate lavalink
              docker compose up -d --wait lavalink
              docker compose restart bot
            fi
            if [ -f /var/lib/vybertron-recovery/settings.json ]; then
              install -m 644 ops/vybertron-recovery.service ops/vybertron-recovery.timer /etc/systemd/system/
              systemctl daemon-reload
              systemctl enable --now vybertron-recovery.timer
            fi
            docker image prune -f
