name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    # Dormant until the repo variable DEPLOY_ENABLED is set to "true"
    # (Settings -> Secrets and variables -> Actions -> Variables).
    # Also requires secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 45m
          script: |
            set -euo pipefail
            cd ~/Vybertron
            TARGET_SHA='${{ github.event.workflow_run.head_sha }}'
            [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
            git fetch --no-tags origin main
            git cat-file -e "${TARGET_SHA}^{commit}"
            git merge-base --is-ancestor "$TARGET_SHA" origin/main
            # Keep the exact tested driver outside Git so rollback remains
            # available even when the previous commit predates this script.
            install -d -m 700 /var/lib/vybertron-recovery
            git show "${TARGET_SHA}:ops/deploy.py" > /var/lib/vybertron-recovery/deploy-driver.py.tmp
            chmod 600 /var/lib/vybertron-recovery/deploy-driver.py.tmp
            mv /var/lib/vybertron-recovery/deploy-driver.py.tmp /var/lib/vybertron-recovery/deploy-driver.py
            python3 /var/lib/vybertron-recovery/deploy-driver.py deploy "$TARGET_SHA" --repo "$PWD"
            if [ -f /var/lib/vybertron-recovery/settings.json ]; then
              install -m 644 ops/vybertron-recovery.service ops/vybertron-recovery.timer /etc/systemd/system/
              systemctl daemon-reload
              systemctl enable --now vybertron-recovery.timer
            fi
            # Previous images and private journals are retained for rollback.
