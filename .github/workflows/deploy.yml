name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    # Dormant until the repo variable DEPLOY_ENABLED is set to "true"
    # (Settings -> Secrets and variables -> Actions -> Variables).
    # Also requires secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/Vybertron
            OLD_HEAD=$(git rev-parse HEAD)
            git fetch origin main
            git reset --hard origin/main
            docker compose pull
            docker compose up -d --build
            # Bind-mounted files don't change the Compose hash.
            if ! git diff --quiet "$OLD_HEAD" HEAD -- warp/ docker-compose.yml; then
              # These services share WARP's network namespace. Recreate them
              # together, then reconnect the bot after Lavalink is healthy.
              docker compose up -d --force-recreate warp yt-cipher lavalink
              docker compose up -d --wait lavalink
              docker compose restart bot
            elif ! git diff --quiet "$OLD_HEAD" HEAD -- lavalink/; then
              docker compose up -d --force-recreate lavalink
              docker compose up -d --wait lavalink
              docker compose restart bot
            fi
            docker image prune -f
