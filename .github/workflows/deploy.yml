name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    # Dormant until the repo variable DEPLOY_ENABLED is "true". Also requires
    # the variable PORTAL_GUILD_ID and secrets VPS_HOST, VPS_HOST_KEY (the
    # server's public host key lines, without host names), VPS_USER and
    # VPS_SSH_KEY. A host with no public SSH port also sets the variables
    # TS_OAUTH_CLIENT_ID and TS_AUDIENCE (docs/host-migration.md); VPS_HOST is
    # then its tailnet address. Releases the exact bot and portal images that CI tested
    # through the guarded portal driver (idle lease, journal, rollback). Audio services are never changed:
    # a commit that touches them stops before staging and needs an operator.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Most of this budget is waiting for listeners to finish; see "Release once nobody is listening".
    timeout-minutes: 330
    permissions:
      contents: read
      actions: write
      # Only for the tailnet join below: Tailscale trusts this job's OIDC token.
      id-token: write
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      CI_RUN_ID: ${{ github.event.workflow_run.id }}
      GUILD_ID: ${{ vars.PORTAL_GUILD_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release inputs
        run: |
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$GUILD_ID" =~ ^[0-9]{17,20}$ ]] || { echo "::error::Set the PORTAL_GUILD_ID repository variable."; exit 1; }
          git merge-base --is-ancestor "$TARGET_SHA" origin/main

      # A host without a public SSH port (a home server) is reached over the
      # tailnet instead. Tailscale trusts this job's GitHub OIDC token, so no
      # Tailscale secret is stored. The ephemeral tag:ci node leaves when the job ends.
      - name: Join the tailnet
        if: vars.TS_OAUTH_CLIENT_ID != ''
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ secrets.VPS_HOST }}

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          [ -n "$VPS_HOST_KEY" ] || { echo "::error::Set the VPS_HOST_KEY secret to the server's public host key."; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # Trust only the pinned host key, never whatever answers on the network.
          while read -r key; do
            if [ -n "$key" ]; then printf '%s %s\n' "$VPS_HOST" "$key"; fi
          done <<< "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy\n  IdentitiesOnly yes\n  BatchMode yes\n  StrictHostKeyChecking yes\n  ServerAliveInterval 30\n' "$VPS_HOST" "$VPS_USER" > ~/.ssh/config

      - name: Plan the release
        id: plan
        run: |
          RUNNING=$(ssh vps "docker inspect --format '{{index .Config.Labels \"org.opencontainers.image.revision\"}}' vybertron-bot")
          [[ "$RUNNING" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::The running bot has no revision label; release manually."; exit 1; }
          if [ "$RUNNING" = "$TARGET_SHA" ] || git merge-base --is-ancestor "$TARGET_SHA" "$RUNNING"; then
            echo "Running $RUNNING already includes $TARGET_SHA; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git merge-base --is-ancestor "$RUNNING" "$TARGET_SHA" || { echo "::error::Running $RUNNING is not an ancestor of $TARGET_SHA; release manually."; exit 1; }
          AUDIO=$(git diff --name-only "$RUNNING" "$TARGET_SHA" -- docker-compose.yml lavalink/ warp/ ops/PlaybackProbe.java)
          if [ -n "$AUDIO" ]; then
            echo "::error::Audio service files changed since $RUNNING: $(tr '\n' ' ' <<< "$AUDIO"). The portal driver never recreates audio; release with an operator (docs/portal-operations.md)."
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Fetch the CI-tested images
        if: steps.plan.outputs.release == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vybertron-*.tar.gz
          path: images
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify image identity and package the source
        if: steps.plan.outputs.release == 'true'
        run: |
          for name in bot portal; do
            gunzip -c "images/vybertron-$name.tar.gz" | docker load -q
            LABEL=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "vybertron-$name:sha-$TARGET_SHA")
            [ "$LABEL" = "$TARGET_SHA" ] || { echo "::error::vybertron-$name is labelled $LABEL, not $TARGET_SHA."; exit 1; }
          done
          git archive --format=tar.gz -o source.tar.gz "$TARGET_SHA"

      - name: Stage the release
        if: steps.plan.outputs.release == 'true'
        run: |
          for name in bot portal; do
            scp -q "images/vybertron-$name.tar.gz" "vps:/var/lib/vybertron-portal/images-$TARGET_SHA-$name.tar.gz"
          done
          scp -q source.tar.gz "vps:/var/lib/vybertron-portal/source-$TARGET_SHA.tar.gz"
          # shellcheck disable=SC2029 # the SHA and guild are meant to expand locally
          ssh vps "S=$TARGET_SHA G=$GUILD_ID bash -s" <<'REMOTE'
          set -euo pipefail
          P=/var/lib/vybertron-portal; R="$P/releases/$S"; D=/var/lib/vybertron-recovery
          for name in bot portal; do
            gunzip -c "$P/images-$S-$name.tar.gz" | docker load -q
            rm -f "$P/images-$S-$name.tar.gz"
          done
          # git archive is deterministic per commit, so an existing release
          # directory (a retried run) already holds identical source.
          if [ ! -d "$R" ]; then
            install -d -m 700 "$R.tmp"
            tar -xzf "$P/source-$S.tar.gz" -C "$R.tmp"
            printf '{"revision":"%s"}\n' "$S" > "$R.tmp/.portal-release.json"
            chmod 600 "$R.tmp/.portal-release.json"
            mv "$R.tmp" "$R"
          fi
          rm -f "$P/source-$S.tar.gz"
          # Keep the exact tested drivers outside Git, retaining the previous
          # pair so a source rollback still has a matching driver.
          for name in portal-driver.py deploy.py; do
            if [ -f "$D/$name" ]; then cp -p "$D/$name" "$D/$name.previous"; fi
          done
          install -m 600 "$R/ops/portal_deploy.py" "$D/portal-driver.py"
          install -m 600 "$R/ops/deploy.py" "$D/deploy.py"
          REMOTE

      # The driver refuses to restart the bot while anyone is listening. Wait on the bot's read-only
      # /maintenance status (which never pauses /play), then release; if a session starts in between,
      # the driver refuses before changing anything and the wait resumes.
      - name: Release once nobody is listening
        if: steps.plan.outputs.release == 'true'
        run: |
          deadline=$((SECONDS + 300 * 60)); unreadable=0
          # Prints idle, busy or unreadable. Only a valid status counts as busy.
          state() {
            ssh vps "docker exec -i vybertron-bot node --input-type=module" <<'JS' 2>/dev/null | jq -r 'if (.busy | type) == "boolean" and (.inFlight | type) == "number" then (if .busy == false and .inFlight == 0 then "idle" else "busy" end) else "unreadable" end' 2>/dev/null || echo unreadable
          const r = await fetch('http://127.0.0.1:' + (Number(process.env.VYBERTRON_HEALTH_PORT) || 3000) + '/maintenance', { signal: AbortSignal.timeout(5000) });
          if (!r.ok) process.exit(1);
          console.log(JSON.stringify(await r.json()));
          JS
          }
          while true; do
            STATE=$(state | tail -n 1); [ -n "$STATE" ] || STATE=unreadable
            if [ "$STATE" = unreadable ]; then
              unreadable=$((unreadable + 1))
              # Ride out a dropped connection or a recovery restart, not a bot that stays down.
              [ "$unreadable" -lt 5 ] || { echo "::error::Could not read the bot's status for 5 minutes; check the bot, then re-run Deploy."; exit 1; }
            else
              unreadable=0
            fi
            if [ "$STATE" = idle ]; then
              # shellcheck disable=SC2029 # the SHA and guild are meant to expand locally
              if RESULT=$(ssh vps "python3 /var/lib/vybertron-recovery/portal-driver.py deploy --sha $TARGET_SHA --guild-id $GUILD_ID --repo /var/lib/vybertron-portal/releases/$TARGET_SHA"); then
                echo "$RESULT"; exit 0
              fi
              echo "$RESULT"
              [ "$(jq -r '.error // empty' <<< "$RESULT" 2>/dev/null)" = deployment_waiting_for_idle ] || exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Someone was still listening after 5 hours; re-run Deploy once the bot is idle."
              exit 1
            fi
            echo "Waiting for the bot to go idle ($(date -u +%H:%M) UTC)."
            sleep 60
          done

      - name: Verify the running release
        if: steps.plan.outputs.release == 'true'
        run: |
          # shellcheck disable=SC2029 # the container name is meant to expand locally
          for name in bot portal; do
            STATE=$(ssh vps "docker inspect --format '{{index .Config.Labels \"org.opencontainers.image.revision\"}} {{.State.Health.Status}}' vybertron-$name")
            echo "$name: $STATE"
            [ "$STATE" = "$TARGET_SHA healthy" ] || { echo "::error::vybertron-$name is not the healthy target release."; exit 1; }
          done

      # The image artifacts only exist to reach this job; drop them once shipped.
      - name: Remove the shipped image artifacts
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("vybertron-")) | .id' |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"; done
