services:
  # Solves YouTube signature-cipher challenges by running the real player
  # script; youtube-source's built-in Java extractor can no longer keep up
  # with YouTube's cipher churn ("must find sig function").
  yt-cipher:
    image: ghcr.io/kikkia/yt-cipher:master
    container_name: vybertron-yt-cipher
    restart: unless-stopped
    expose:
      - "8001"
    networks:
      - vybertron

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: vybertron-lavalink
    restart: unless-stopped
    environment:
      - _JAVA_OPTIONS=-Xmx512M
      - LAVALINK_SERVER_PASSWORD=${LAVALINK_PASSWORD}
      - SPOTIFY_SP_DC=${SPOTIFY_SP_DC}
      - YOUTUBE_REFRESH_TOKEN=${YOUTUBE_REFRESH_TOKEN}
      - POT_TOKEN=${POT_TOKEN}
      - POT_VISITOR_DATA=${POT_VISITOR_DATA}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
    expose:
      - "2333"
    networks:
      - vybertron
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--header", "Authorization: ${LAVALINK_PASSWORD}", "http://localhost:2333/version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  bot:
    build: .
    container_name: vybertron-bot
    restart: unless-stopped
    depends_on:
      lavalink:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - CLIENT_ID=${CLIENT_ID}
      - LAVALINK_HOST=lavalink
      - LAVALINK_PORT=2333
      - LAVALINK_PASSWORD=${LAVALINK_PASSWORD}
    networks:
      - vybertron

networks:
  vybertron:
