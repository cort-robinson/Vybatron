x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Gives only the audio stack a clean egress IP. The bot and VPS host keep
  # their normal network path, so Discord control traffic and SSH are isolated
  # from WARP. The alias lets the bot reach Lavalink in this shared namespace.
  warp:
    image: caomingjun/warp@sha256:7b2df2f0d589bdcd3d93c28ccc08cf04d54c81f193682dd1b6da82d7b39e4bb6
    container_name: vybertron-warp
    restart: unless-stopped
    logging: *bounded-logging
    pids_limit: 128
    entrypoint: ["/bin/bash", "/opt/warp/supervise.sh"]
    # Normally about 100 MiB. Bound daemon growth before it exhausts the VPS.
    mem_limit: 384m
    memswap_limit: 512m
    environment:
      - WARP_SLEEP=5
    cap_add:
      - NET_ADMIN
      - MKNOD
    device_cgroup_rules:
      - "c 10:200 rwm"
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - warp-data:/var/lib/cloudflare-warp
      - ./warp/supervise.sh:/opt/warp/supervise.sh:ro
    networks:
      vybertron:
        aliases:
          - lavalink

  # Solves YouTube signature-cipher challenges by running the real player
  # script; youtube-source's built-in Java extractor can no longer keep up
  # with YouTube's cipher churn ("must find sig function").
  yt-cipher:
    image: ghcr.io/kikkia/yt-cipher@sha256:4c5ec381ff57336cfc24822d2b526a5ad7cd0171f61065a1bbc87bb736842449
    container_name: vybertron-yt-cipher
    restart: unless-stopped
    logging: *bounded-logging
    mem_limit: 512m
    memswap_limit: 768m
    pids_limit: 256
    network_mode: service:warp
    depends_on:
      warp:
        condition: service_healthy

  lavalink:
    # Lavalink 4.2.2, verified with the production DAVE voice stack.
    image: ghcr.io/lavalink-devs/lavalink@sha256:87ae53e60dc147c9dddb28e126ce503a26bc8d1477ed8d99543614677882afff
    container_name: vybertron-lavalink
    restart: unless-stopped
    logging: *bounded-logging
    mem_limit: 768m
    memswap_limit: 896m
    pids_limit: 256
    stop_grace_period: 30s
    network_mode: service:warp
    depends_on:
      warp:
        condition: service_healthy
      yt-cipher:
        condition: service_started
    environment:
      # Keep YouTube API and signed media requests on WARP's stable IPv4 egress.
      - _JAVA_OPTIONS=-Xmx512M -Djava.net.preferIPv4Stack=true
      - LAVALINK_SERVER_PASSWORD=${LAVALINK_PASSWORD:?LAVALINK_PASSWORD is required}
      - SPOTIFY_SP_DC=${SPOTIFY_SP_DC:-}
      - YOUTUBE_REFRESH_TOKEN=${YOUTUBE_REFRESH_TOKEN:-}
      - POT_TOKEN=${POT_TOKEN:-}
      - POT_VISITOR_DATA=${POT_VISITOR_DATA:-}
    # Adds the locally built vybatron-audio plugin (lavalink/plugins/build.sh),
    # which streams audio-only songs to portal listeners on their own device.
    # Without the jar Lavalink starts exactly as before and Discord is unaffected.
    entrypoint: ["sh", "-c", "mkdir -p plugins && cp /opt/vybatron/vybatron-audio.jar plugins/ 2>/dev/null || true; exec java -jar Lavalink.jar"]
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - ./lavalink/plugins:/opt/vybatron:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --header \"Authorization: $${LAVALINK_SERVER_PASSWORD}\" http://localhost:2333/version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  bot:
    build: .
    image: vybertron-bot:${VYBERTRON_RELEASE:-local}
    container_name: vybertron-bot
    restart: unless-stopped
    init: true
    logging: *bounded-logging
    mem_limit: 256m
    memswap_limit: 384m
    pids_limit: 128
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      lavalink:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:?DISCORD_BOT_TOKEN is required}
      - CLIENT_ID=${CLIENT_ID:?CLIENT_ID is required}
      - NODE_OPTIONS=--max-old-space-size=160
      - VYBERTRON_DATA_DIR=/app/data
      - LAVALINK_HOST=lavalink
      - LAVALINK_PORT=2333
      - LAVALINK_PASSWORD=${LAVALINK_PASSWORD:?LAVALINK_PASSWORD is required}
    volumes:
      - bot-data:/app/data
    networks:
      - vybertron
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

networks:
  vybertron:

volumes:
  warp-data:
  bot-data:
