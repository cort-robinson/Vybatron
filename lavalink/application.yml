server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.1"
      repository: "https://maven.lavalink.dev/releases"
    # Snapshot pin: 4.8.3 release has a broken Spotify anonymous-token scraper
    # ("No secret array found in script"). Move back to a release pin once one
    # ships with the fix. Jar existence verified per SPEC V11.
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:20d6b0b"
      repository: "https://maven.lavalink.dev/snapshots"
      snapshot: true
  server:
    password: "${LAVALINK_SERVER_PASSWORD}"
    sources:
      # Built-in YouTube must stay off; the youtube-source plugin replaces it.
      youtube: false
      soundcloud: true
      bandcamp: true
      twitch: false
      vimeo: false
      http: false
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
    # Datacenter IPs (VPS) get "This video requires login" from YouTube.
    # OAuth with a throwaway Google account fixes it. First boot with an empty
    # refresh token logs a device-flow code: visit google.com/device, enter it,
    # then copy the refresh token from the log into .env (YOUTUBE_REFRESH_TOKEN)
    # so it survives restarts.
    oauth:
      enabled: true
      refreshToken: "${YOUTUBE_REFRESH_TOKEN}"
  lavasrc:
    providers:
      - 'ytsearch:"%ISRC%"'
      - "ytsearch:%QUERY%"
    sources:
      spotify: true
      applemusic: false
      deezer: false
      yandexmusic: false
      flowerytts: false
      youtube: false
      vkmusic: false
      tidal: false
      qobuz: false
      ytdlp: false
      jiosaavn: false
    spotify:
      # Account token via sp_dc browser cookie (free account works). Anonymous
      # tokens are aggressively rate-limited by Spotify since 2025; API
      # clientId/clientSecret would require Premium for newly created apps.
      # Cookie lives ~1 year; refresh it in .env from open.spotify.com devtools.
      spDc: "${SPOTIFY_SP_DC}"
      countryCode: "US"
      playlistLoadLimit: 6
      albumLoadLimit: 6

logging:
  level:
    root: INFO
    lavalink: INFO
