server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    # Snapshot pin: restores TV OAuth playback after YouTube rejected the old
    # client identity (#233), and fixes truncated itag 18 streams (#235).
    # Jar verified per SPEC V11; decoded a complete track before deploying.
    - dependency: "dev.lavalink.youtube:youtube-plugin:f45bbb7aebfcbc1c553769e04af6cd43afa8b7c3"
      repository: "https://maven.lavalink.dev/snapshots"
      snapshot: true
    # Snapshot pin: 4.8.3 release has a broken Spotify anonymous-token scraper
    # ("No secret array found in script"). Move back to a release pin once one
    # ships with the fix. Jar existence verified per SPEC V11.
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:20d6b0b"
      repository: "https://maven.lavalink.dev/snapshots"
      snapshot: true
  server:
    password: "${LAVALINK_SERVER_PASSWORD}"
    sources:
      # Built-in YouTube must stay off; the youtube-source plugin replaces it.
      youtube: false
      soundcloud: true
      bandcamp: true
      twitch: false
      vimeo: false
      http: false
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      # TV is the only OAuth-capable client in youtube-source 1.18.x; it handles
      # authenticated playback while the others provide search/metadata.
      - TV
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
    # OAuth handles authenticated playback while the Compose WARP sidecar keeps
    # YouTube media requests off the blocked VPS egress address.
    oauth:
      enabled: true
      refreshToken: "${YOUTUBE_REFRESH_TOKEN}"
    # yt-cipher shares Lavalink's WARP network namespace and is reachable only
    # over loopback, so no public port or sidecar authentication is needed.
    remoteCipher:
      url: "http://127.0.0.1:8001"
    # Proof-of-origin token for WEB/WEBEMBEDDED clients; generate on the VPS:
    #   docker run --rm quay.io/invidious/youtube-trusted-session-generator
    # then put po_token/visitor_data into .env. Regenerate if streams 403 again.
    pot:
      token: "${POT_TOKEN}"
      visitorData: "${POT_VISITOR_DATA}"
  lavasrc:
    providers:
      - 'ytsearch:"%ISRC%"'
      - "ytsearch:%QUERY%"
    sources:
      spotify: true
      applemusic: false
      deezer: false
      yandexmusic: false
      flowerytts: false
      youtube: false
      vkmusic: false
      tidal: false
      qobuz: false
      ytdlp: false
      jiosaavn: false
    spotify:
      # Account token via sp_dc browser cookie (free account works). Anonymous
      # tokens are aggressively rate-limited by Spotify since 2025; API
      # clientId/clientSecret would require Premium for newly created apps.
      # Cookie lives ~1 year; refresh it in .env from open.spotify.com devtools.
      spDc: "${SPOTIFY_SP_DC}"
      countryCode: "US"
      playlistLoadLimit: 6
      albumLoadLimit: 6

logging:
  level:
    root: INFO
    lavalink: INFO
