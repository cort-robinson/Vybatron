server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    # Tested production snapshot, promoted from the automatic recovery override.
    # No release contains it yet (5 commits after 1.18.2). Jar checksums are in
    # plugins.sha256; recovery keeps loaded jars in plugins/ so recreating
    # Lavalink doesn't depend on the snapshot staying published.
    # Two complete tracks decoded through FINISHED on Lavalink 4.2.2 (2026-10-04).
    - dependency: "dev.lavalink.youtube:youtube-plugin:2be8e542d3f6f178e048dca565892684c2e40177"
      repository: "https://maven.lavalink.dev/snapshots"
      snapshot: true
    # Release build of the previously pinned snapshot 20d6b0b (the 4.8.3 tag
    # commit): every class and resource is byte-identical apart from the version
    # string in the plugin manifest.
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false
    # Lyrics API for /lyrics and the portal player. LavaSrc supplies the sources
    # (plugins.lavasrc.lyrics-sources below).
    - dependency: "com.github.topi314.lavalyrics:lavalyrics-plugin:1.1.0"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false
  server:
    password: "${LAVALINK_SERVER_PASSWORD}"
    sources:
      # Built-in YouTube must stay off; the youtube-source plugin replaces it.
      youtube: false
      soundcloud: true
      bandcamp: true
      twitch: false
      vimeo: false
      # Plays TorBox audio through the bot's relay when YouTube fails. Listener
      # queries can't reach it: validatePlaybackQuery admits only catalog links.
      http: true
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      # TV is the only OAuth-capable client in youtube-source 1.18.x; it handles
      # authenticated playback while the others provide search/metadata.
      - TV
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
    # OAuth handles authenticated playback while the Compose WARP sidecar keeps
    # YouTube media requests off the blocked VPS egress address.
    oauth:
      enabled: true
      refreshToken: "${YOUTUBE_REFRESH_TOKEN}"
    # yt-cipher shares Lavalink's WARP network namespace and is reachable only
    # over loopback, so no public port or sidecar authentication is needed.
    remoteCipher:
      url: "http://127.0.0.1:8001"
    # Proof-of-origin token for WEB/WEBEMBEDDED clients; generate on the VPS:
    #   docker run --rm quay.io/invidious/youtube-trusted-session-generator
    # then put po_token/visitor_data into .env. Regenerate if streams 403 again.
    pot:
      token: "${POT_TOKEN}"
      visitorData: "${POT_VISITOR_DATA}"
  lavasrc:
    providers:
      - 'ytsearch:"%ISRC%"'
      - "ytsearch:%QUERY%"
    sources:
      spotify: true
      applemusic: false
      deezer: false
      yandexmusic: false
      flowerytts: false
      youtube: false
      vkmusic: false
      tidal: false
      qobuz: false
      ytdlp: false
      jiosaavn: false
    lyrics-sources:
      # LRCLIB (lrclib.net): synced lyrics by title and artist, no account.
      lrcLib: true
    spotify:
      # Account token via sp_dc browser cookie (free account works). Anonymous
      # tokens are aggressively rate-limited by Spotify since 2025; API
      # clientId/clientSecret would require Premium for newly created apps.
      # Cookie lives ~1 year; refresh it in .env from open.spotify.com devtools.
      spDc: "${SPOTIFY_SP_DC}"
      countryCode: "US"
      playlistLoadLimit: 6
      albumLoadLimit: 6

logging:
  level:
    root: INFO
    lavalink: INFO
