server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.1"
      repository: "https://maven.lavalink.dev/releases"
    # Snapshot pin: 4.8.3 release has a broken Spotify anonymous-token scraper
    # ("No secret array found in script"). Move back to a release pin once one
    # ships with the fix. Jar existence verified per SPEC V11.
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:20d6b0b"
      repository: "https://maven.lavalink.dev/snapshots"
      snapshot: true
  server:
    password: "${LAVALINK_SERVER_PASSWORD}"
    sources:
      # Built-in YouTube must stay off; the youtube-source plugin replaces it.
      youtube: false
      soundcloud: true
      bandcamp: true
      twitch: false
      vimeo: false
      http: false
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
  lavasrc:
    providers:
      - 'ytsearch:"%ISRC%"'
      - "ytsearch:%QUERY%"
    sources:
      spotify: true
      applemusic: false
      deezer: false
      yandexmusic: false
      flowerytts: false
      youtube: false
      vkmusic: false
      tidal: false
      qobuz: false
      ytdlp: false
      jiosaavn: false
    spotify:
      # Anonymous token: resolves Spotify links (tracks/albums/playlists) without
      # API credentials. Text search (spsearch:) would require clientId/clientSecret,
      # which Spotify now gates behind Premium for new apps.
      preferAnonymousToken: true
      customTokenEndpoint: "http://spotify-tokener:8080/api/token"
      countryCode: "US"
      playlistLoadLimit: 6
      albumLoadLimit: 6

logging:
  level:
    root: INFO
    lavalink: INFO
